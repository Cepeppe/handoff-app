[package]
name = "handoff-app"
version = "1.4.0"
description = "Baton: the contextual handoff overlay"
authors = ["Cepeppe"]
edition = "2021"
license = "LicenseRef-Baton-Proprietary"
publish = false

# The library holds everything; the binary is a three-line entry point. The `_lib` suffix
# keeps the library name distinct from the binary name, which Windows requires.
[lib]
name = "handoff_app_lib"
crate-type = ["lib"]

[[bin]]
name = "handoff-app"
path = "src/main.rs"

[features]
default = []
# The e2e automation channel of DD-33 (a second token-protected socket that plays the
# user). Release builds never enable it, and CI asserts the symbols are absent. It pulls
# `fake-capture` in with it: a harness with nobody at the keyboard cannot drag a rectangle
# across the screen, so every e2e capture comes from a fixture (§7.8).
e2e = ["fake-capture"]
# A capture backend that returns a fixture image instead of touching the screen (§7.8).
fake-capture = []
# The v2 extension point of §12.2: writing secrets into `.env`-style files. Off in every
# v1 build, and the module it gates is empty on purpose.
secrets-write = []
# The HTTP client of `net::egress`, and the only way an HTTP client enters this crate
# (§7.13, DD-32). It is **off by default**, so the binary a person installs today links no
# network stack at all: the update check that is its one intended caller is deferred with
# the public release (`TASKS.md` §0.4 item 8, T-078), and NET-02's firewall test expects zero
# domains until then. Everything else of the boundary is compiled unconditionally — the
# module, the recording of `network_events`, the domain rule — so what the feature gates is
# the client and nothing else. CI compiles and tests it (`cargo lint` is `--all-features`,
# and a `cargo test --features net` step runs its suite), which is what keeps a gated module
# from rotting. T-078 turns it on by adding it to `default` and writing the caller.
net = ["dep:reqwest"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The one encoding a redacted screenshot may cross the channel in: §6.6 lets pixels reach
# the server only inside an outcome, and the `image` field of `channel.v1.schema.json` is a
# base64 PNG (`DEVIATIONS.md`, 2026-09-08). It adds **no crate to the graph**: `wry`, which
# every Tauri build links, already resolves the same 0.22.1, so this line names something
# that is compiled either way rather than deciding that the product may ship one more thing.
base64 = "0.22.1"
# Only to compare `last_verified_at` as an instant when the matching rule ranks runbooks
# (§4.5.3). `clock` is off: nothing here reads the wall clock, and the feature would pull a
# time-zone database this crate has no use for.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# The order-preserving map behind every open object of the formats (`values`, `secrets`,
# `step_values`, `values_to_fill`). The certain detector reports the locations of a spec in
# document order (§5.5), which a sorted or hashed map would lose. It is already in the tree
# as the map `serde_json/preserve_order` uses.
indexmap = { version = "2.14", features = ["serde"] }
# The RGBA buffer every capture is, and the PNG the preview draws (§7.8, CAP-05). Only the
# PNG codec: `default-features` would bring AVIF, TIFF, WebP and a dozen others, none of
# which this application ever reads or writes, and `rayon` with them. The version is pinned
# to the one `xcap` resolves, because `RgbaImage` crosses the boundary between them and two
# copies of `image` in the tree would be two incompatible types with the same name.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Draft 2020-12 validation of the vendored schemas. `default-features = false` is
# load-bearing: the defaults enable `resolve-http`, which pulls `reqwest` — banned outright
# by `deny.toml` and by `clippy.toml` while the app makes zero network connections (§7.13).
# Without it the crate resolves nothing over the network, which is what we want anyway: the
# four schemas are registered as in-memory resources.
jsonschema = { version = "0.55", default-features = false }
# The bundled OCR engine of OCR-03 and FM-16: pure Rust, English models, nothing fetched at
# build time (`DEVIATIONS.md`, 2026-09-09, has the survey that ruled Tesseract out). Its two
# `.rten` models are committed under `models/ocrs/` and shipped as Tauri resources, not
# linked in. `default-features = false` drops `export-wasm`, which is only meaningful for a
# `wasm32` target this application never builds; `rten` is the inference engine the models
# are in the format of, and it is the crate that brings `rayon` into the tree — the one
# place a thread pool earns its keep here, since a full-resolution capture (CAP-05) is what
# it is asked to read.
ocrs = { version = "0.13.0", default-features = false, features = ["rten"] }
rand = "0.10.2"
regex = "1.13.1"
# The one HTTP client of the application, reachable from `net::egress` alone (§7.13, DD-32),
# and optional: without the `net` feature it is not in the build at all. `default-features`
# would bring `native-tls` (schannel here, openssl elsewhere) and a cookie store; neither is
# wanted, and UPD-01 is explicit that the check carries no identifier. `rustls-tls` uses the
# `webpki-roots` trust anchors compiled into the binary rather than the platform store, so
# the one connection this crate can make trusts the same roots on every machine and needs no
# certificate code of its own. `blocking` because §7.13 gives `get` a synchronous signature
# and §7.2 calls the update check from `run()`, which is outside a tokio runtime.
reqwest = { version = "0.12", optional = true, default-features = false, features = [
  "blocking",
  "rustls-tls-native-roots",
] }
# The inference engine `ocrs` runs on, named here because loading a `.rten` file is
# `rten::Model::load_file` and `ocrs` does not re-export it. The version tracks the one
# `ocrs` resolves: two copies of `rten` in the tree would be two `Model` types with the same
# name, and the second would not fit `OcrEngineParams`. `default-features = false` is what
# `ocrs` itself asks for.
rten = { version = "0.26.0", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
# The constant-time comparison of the channel token (§6.2, SRV-07). The peer the token
# defends against can reconnect as often as it likes, so a comparison that returned early on
# the first wrong nibble would hand the token out four bits at a time. Hand-writing one is a
# way to have it optimised away without noticing.
subtle = "2.6.1"
sysinfo = "0.39.6"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-window-state = "2.4.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
# The TOML of Codex's `config.toml`, edited in place (§7.15, T-067). `toml_edit` and not
# `toml`: the file is the user's, written by hand and commented, and INST-04 promises that
# registering Baton leaves every other line of it as it was. `toml_edit` keeps comments, blank
# lines and the spelling of every value it is not asked to change, where a parse into values
# and back would lose all three. The same version is already in the tree under a proc-macro,
# so this line adds an edge to the graph and not a crate.
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
# The OS trash, for **Delete** on the Runbooks page (§7.12). A runbook is a recipe the user
# spent a handoff producing, so it is moved rather than removed — and the platform's own
# trash is the one place they already know how to look for it. Its default features are the
# Windows COM apartment (kept: `IFileOperation` needs one) and `chrono`, which is only used
# by the Linux implementation of listing and restoring; neither platform of §1.5 reaches it,
# and this crate builds `chrono` without its clock on purpose.
trash = { version = "5.2.4", default-features = false, features = [
  "coinit_apartmentthreaded",
] }
# NFKC, the first step of both normalisations of the matching rule (§4.5.3). The server
# gets it from `String.prototype.normalize`; this is the same algorithm.
unicode-normalization = { version = "0.1.25", default-features = false }
# The screen capture of §7.8 (A-25): the monitor list with its geometry and scale factors,
# and the pixels of one monitor. Default features only — the `image` feature would turn
# `image`'s own defaults back on (it is spelled `image/default`), and `wgc` swaps the GDI
# path for Windows.Graphics.Capture, which draws the yellow "recording" border around every
# monitor it touches.
xcap = { version = "0.9.8", default-features = false }

[dev-dependencies]
# The property suite of the store (§11.2, T-033): random sequences of user and agent actions
# against the state machine of §8.1. `default-features = false` with `std` keeps the process
# forking and the per-case timeout out of the tree — the properties here are assertions, not
# guards against a hang, and a test binary that re-executes itself is one more thing to
# explain on a machine where Smart App Control judges every freshly linked executable.
proptest = { version = "1.9.0", default-features = false, features = ["std"] }

# The named pipe of the channel carries an explicit DACL granting access to this user alone
# (§6.2, A-16), which needs the process token's SID and an SDDL conversion; the token file
# is created with the same descriptor. `requests::focus` raises the terminal's window
# (OPEN-05). The five WinRT namespaces at the bottom are the OS OCR engine of §7.9: the
# engine itself, the `SoftwareBitmap` a capture is handed to it as, the `DataWriter` that
# carries the pixels into one, and the BCP-47 language the spec's `lang` becomes (OCR-05).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }

# GDI, to draw the synthetic text the OCR tests read back (`ocr::windows`). It is a
# dev-dependency and not a feature of the entry above on purpose: nothing the application
# ships draws anything with GDI, and a feature added for a test is a feature somebody will
# reach for in production a year from now. Cargo leaves it out of a plain `cargo build`.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Gdi"] }

# `NSRunningApplication`, and only that: the macOS half of the best-effort terminal focus of
# OPEN-05 (`requests::focus`). It is already in the tree as a dependency of Tauri's own
# windowing layer, so this adds a name rather than a crate; `libc` is the feature that
# unlocks the one constructor that takes a pid.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSRunningApplication",
  "libc",
] }
