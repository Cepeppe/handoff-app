# Codex settings, edited by hand.
model = "gpt-5.6-luna"
approval_policy = "on-request"   # ask before running a command

[mcp_servers.docs]
command = "npx"
args = ["-y", "@example/docs-mcp"]
env = { DOCS_ROOT = "C:/docs" }

# The database server of the shop.
[mcp_servers.shop-db]
command = 'C:\tools\shop-db.exe'
tool_timeout_sec = 60

[profiles.fast]
model_reasoning_effort = "low"
