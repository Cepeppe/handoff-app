# Lint enforcement of the network boundary (TECHNICAL-DESIGN §7.13, NET-01, PRIN-05).
#
# The promise the app makes is "no network connection except the update check, through one
# module". A promise nobody checks decays: this configuration is the check that runs on
# every `cargo clippy -D warnings`, which is a CI gate.
#
# The rule is lifted in exactly one file: `src/net/egress.rs` carries a module-level
# `#![allow(clippy::disallowed_types)]` with the reason, and it is the single egress point of
# DD-32. Nothing else in this crate may name one of these types, and
# `tests/egress_boundary.rs` reads the sources to say the same thing a second way — a lint
# can be silenced with an attribute, and that test is what notices the attribute.
#
# `allow-invalid` stays: `reqwest` is an **optional** dependency behind the `net` feature,
# off by default while the update check is deferred (TASKS.md §0.4 item 8, T-078), so a plain
# `cargo clippy` cannot resolve those two paths. Without it the rule would be refused in the
# very build it matters most for. `cargo lint` is `--all-features`, so CI resolves them.
# `deny.toml` covers the other half — who may bring a client into the tree at all.
disallowed-types = [
  { path = "reqwest::Client", reason = "network access belongs to net::egress only (§7.13)", allow-invalid = true },
  { path = "reqwest::blocking::Client", reason = "network access belongs to net::egress only (§7.13)", allow-invalid = true },
  { path = "hyper::Client", reason = "network access belongs to net::egress only (§7.13)", allow-invalid = true },
  { path = "hyper::client::conn::http1::SendRequest", reason = "network access belongs to net::egress only (§7.13)", allow-invalid = true },
  { path = "std::net::TcpStream", reason = "network access belongs to net::egress only (§7.13)" },
  { path = "std::net::TcpListener", reason = "network access belongs to net::egress only (§7.13)" },
  { path = "tokio::net::TcpStream", reason = "network access belongs to net::egress only (§7.13)" },
  { path = "tokio::net::TcpListener", reason = "network access belongs to net::egress only (§7.13)" },
]
