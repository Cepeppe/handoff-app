name: e2e

# The end-to-end suite of §11.5, against the real Claude Code, and its Codex (T-067), OpenCode
# (T-074) and Kilo Code (T-081) subsets against the real Codex CLI, OpenCode and Kilo CLI.
#
# `workflow_dispatch` only, and it will stay that way until the owner decides otherwise:
# running a real agent in CI needs an API key, and `TASKS.md` §0.4 item 9 records the decision
# not to provision one — the suite is run by hand with `scripts/e2e.ps1` after every Claude
# Code update, and the result is recorded in `docs/dev/e2e.md`. This file exists so that
# turning it on later is a secret and not a task (T-056 is that task): `ANTHROPIC_API_KEY` for
# Claude Code, `OPENAI_API_KEY` for Codex, `OPENROUTER_API_KEY` for OpenCode, `KILO_API_KEY`
# for Kilo Code, the same four names the canaries of `handoff-mcp` read.
#
# Without the key of the chosen agent every step below is skipped and the job is green, which
# is deliberate: a dispatch by somebody who has not read this should say "nothing to run",
# not fail.
on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'claude-code runs every scenario; codex, opencode and kilo-code run their subsets (T-067, T-074, T-081)'
        type: choice
        options: [claude-code, codex, opencode, kilo-code]
        default: claude-code
      scenarios:
        description: "Scenario ids, space separated; empty runs all of the chosen agent's"
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Is there a key to run the agent with?
        id: gate
        env:
          AGENT: ${{ inputs.agent }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: |
          if [ "$AGENT" = "codex" ]; then
            name=OPENAI_API_KEY; key="${OPENAI_API_KEY:-}"
          elif [ "$AGENT" = "opencode" ]; then
            name=OPENROUTER_API_KEY; key="${OPENROUTER_API_KEY:-}"
          elif [ "$AGENT" = "kilo-code" ]; then
            name=KILO_API_KEY; key="${KILO_API_KEY:-}"
          else
            name=ANTHROPIC_API_KEY; key="${ANTHROPIC_API_KEY:-}"
          fi
          if [ -z "$key" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No $name: the e2e suite is run locally (TASKS.md §0.4 item 9)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain
        if: steps.gate.outputs.run == 'true'
        run: rustc --version

      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.run == 'true'
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'true'

      # The pinned server (§3.5): the same binary the installer registers, so the scenarios
      # run against what ships and not against a local build.
      - name: Fetch the pinned server
        if: steps.gate.outputs.run == 'true'
        run: node scripts/fetch-server.mjs
        env:
          HANDOFF_MCP_READ_TOKEN: ${{ secrets.HANDOFF_MCP_READ_TOKEN }}

      # Release, not debug: a debug build embeds `devUrl` and comes up with an empty webview
      # when there is no Vite dev server (the T-040 handoff entry). `pnpm build` fills the
      # `dist/` a release build loads.
      - name: Build the frontend
        if: steps.gate.outputs.run == 'true'
        run: pnpm build

      - name: Build the app with the automation channel
        if: steps.gate.outputs.run == 'true'
        working-directory: src-tauri
        run: cargo build --release --features e2e --bin handoff-app

      - name: Install Claude Code
        if: steps.gate.outputs.run == 'true' && inputs.agent == 'claude-code'
        run: npm install -g @anthropic-ai/claude-code

      # The Codex subset: the published CLI, logged in with the API key the way the Codex
      # canary of `handoff-mcp` does it (`codex login --with-api-key` reads the key on stdin).
      # The harness runs every `codex exec` with `--ignore-user-config`, apps and plugins off.
      - name: Install Codex
        if: steps.gate.outputs.run == 'true' && inputs.agent == 'codex'
        run: npm install --global @openai/codex

      - name: Log Codex in with the API key
        if: steps.gate.outputs.run == 'true' && inputs.agent == 'codex'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      # The OpenCode subset: the published CLI. Its OpenRouter provider reads
      # `OPENROUTER_API_KEY` from the environment, so there is no login step; the harness runs
      # every `opencode run` on an inline configuration, with the user's own configuration out
      # of reach, and deletes the session each run leaves behind.
      - name: Install OpenCode
        if: steps.gate.outputs.run == 'true' && inputs.agent == 'opencode'
        run: npm install --global opencode-ai

      # The Kilo Code subset: the published CLI. The Kilo Gateway, its free models' provider,
      # reads `KILO_API_KEY` from the environment, so there is no login step; the harness starts
      # the native binary past npm's launcher, runs every `kilo run` on an inline configuration
      # with the user's own configuration out of reach, and deletes the session it leaves.
      - name: Install Kilo Code
        if: steps.gate.outputs.run == 'true' && inputs.agent == 'kilo-code'
        run: npm install --global @kilocode/cli

      - name: Run the scenarios
        if: steps.gate.outputs.run == 'true'
        run: pnpm e2e -- --agent "$AGENT" ${{ inputs.scenarios }}
        env:
          AGENT: ${{ inputs.agent }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}

      - name: The report
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ inputs.agent }}
          path: tests/e2e/results/*.json
          if-no-files-found: ignore
