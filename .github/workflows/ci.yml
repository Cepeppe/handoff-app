name: CI

# A tag push would otherwise run this whole matrix a second time, on top of the release
# workflow that the tag already triggers. Windows minutes cost double, so the branch filter
# is here from the first commit.
#
# A `workflow_dispatch` exists to run the macOS leg, which is dispatch-only while macOS is
# deferred (implementation decision 7). The push run of the same commit already has the Windows
# result, so a dispatch skips the Windows job unless it is asked for; the input is the
# escape hatch for re-running Windows by hand.
#
# A push or a pull request that changes only documentation leaves the three Windows jobs out
# (T-079, implementation decision 11): the `changes` job decides, on Linux, and `windows`,
# `security` and `ui` wait for its answer. They show as *skipped*, so the run still exists and
# concludes `success`. A workflow-level `paths-ignore` would create no run at all, and whoever
# waits for the run of their commit would wait for ever. The `docs` job checks the pages on
# every push and pull request, whatever the answer.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Also run the Windows job (2x minutes); a push already covers it'
        type: boolean
        default: false

permissions:
  contents: read

# One group per event and ref: a newer push cancels the superseded push run of the same
# branch, a newer dispatch the superseded dispatch, and a dispatch never cancels the push
# run of the commit it is checking. With one group shared by both events, the dispatch
# that runs the macOS leg would cancel the Windows run of the very commit it checks.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does this push or pull request change anything but documentation? `code` is `false` only
  # when every changed path is on the allow-list below *and* the commit it is compared with
  # passed this workflow; anything the job cannot decide is code. `docs/dev/testing.md` has the
  # table of what runs on which push, and `src/__tests__/ci.test.ts` runs this very script.
  changes:
    name: changes
    runs-on: ubuntu-latest
    # `actions: read` is for the one question a diff cannot answer: whether the commit it is
    # compared with was itself checked.
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # The whole history, so that the commit before the push is here to compare with; the
      # repository is about 15 MB. A dispatch has no diff and needs none of it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          FORCED: ${{ github.event.forced }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The first answer is the answer.
          answer() {
            echo "code=$1" >> "$GITHUB_OUTPUT"
            echo "code=$1: $2"
            exit 0
          }

          # The allow-list. A push or a pull request made only of paths it accepts leaves the
          # Windows jobs out; every other path is code, a README below the root included.
          documentation() {
            case "$1" in
              # Both notices pages are generated from `Cargo.lock` and compared with the graph
              # by the "Third-party notices are current" step of the `windows` job, so a change
              # to either page alone has to run that job: a hand edit of the crate list is the
              # thing that step exists to refuse.
              docs/third-party-notices.md | docs/it/third-party-notices.md) return 1 ;;
              docs/* | README.md | CHANGELOG.md | LICENSE*) return 0 ;;
              *) return 1 ;;
            esac
          }

          case "$EVENT" in
            push | pull_request) ;;
            *) answer true "a $EVENT has no diff to read" ;;
          esac
          case "$BEFORE" in
            '' | 0000000000000000000000000000000000000000)
              answer true "there is no earlier commit to compare with" ;;
          esac
          if [ "$FORCED" = true ]; then
            answer true "a force push: the commit before it is not in this history"
          fi

          # `--no-renames` lists a moved file under both of its paths. With rename detection a
          # file moved into `docs/` is listed under its new path alone, and the code it was
          # taken out of does not count.
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only --no-renames "$BEFORE...$AFTER") ||
              answer true "the diff could not be read"
          else
            changed=$(git diff --name-only --no-renames "$BEFORE" "$AFTER") ||
              answer true "the diff could not be read"
          fi
          [ -n "$changed" ] || answer true "the diff lists no file"
          while IFS= read -r path; do
            documentation "$path" || answer true "$path is not documentation"
          done <<< "$changed"

          # What changed since BEFORE says nothing of whether BEFORE was checked: a newer push
          # cancels the run of the one before it (the concurrency group above), and a run can
          # be red. A documentation push on top of either would turn `main` green over code no
          # Windows job has passed, so the diff is trusted only on top of a commit whose own
          # push run succeeded, which by this same rule vouches for every commit before it.
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push \
            --commit "$BEFORE" --json conclusion \
            --jq 'map(select(.conclusion == "success")) | length') || passed=0
          [ "${passed:-0}" -gt 0 ] 2>/dev/null ||
            answer true "no push run of this workflow succeeded on $BEFORE"
          answer false "documentation only, on top of a commit that passed"

  # The documentation, on every push and pull request whatever `changes` answered: on a
  # documentation-only push this is the whole of the check, on Linux at the single rate. Every
  # relative link and `#anchor` resolves (moved here from the `windows` job, so that it lives in
  # one place), and the two suites that read a file on the allow-list run: `docs.test.ts`
  # (`docs/`, the README) and `release.test.ts` (`CHANGELOG.md`, which the release workflow
  # takes its notes from). A dispatch skips it as it skips the Windows jobs: the push of the
  # same commit has already run it.
  docs:
    name: docs
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Documentation links
        run: pnpm check:links

      - name: Documentation and changelog tests
        run: pnpm test src/__tests__/docs.test.ts src/__tests__/release.test.ts

  # The three Windows jobs below share this condition. A push or a pull request runs them when
  # `changes` found code in it; a dispatch runs them when its `windows` input asks, whatever
  # `changes` answered, because the push of the same commit has already run them.
  windows:
    name: windows-latest
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.windows) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo clippy --version
          cargo fmt --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-deny

      - run: pnpm install --frozen-lockfile

      # The pinned server artifact (§3.5). The release is public: the run's own token only
      # spares the download the anonymous rate limit of the GitHub API.
      - name: Fetch the pinned server
        run: node scripts/fetch-server.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      # The build gate of §3.5, run here as well as inside `beforeBuildCommand`: with `CI`
      # set it also refuses a `dev-link`ed vendor, so no packaged build can come from a
      # locally built server.
      - name: Check the pinned server
        run: node scripts/fetch-server.mjs --check

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The security suite of §11.7 runs here as one target among the others; the `security`
      # job below runs it again on its own, prints its numbers and keeps its report.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # Two things are behind a feature and compile to nothing in the run above: the
      # transport of the automation channel (DD-33) and the HTTP client of `net::egress`
      # (§7.13, off by default while the update check is deferred). One invocation covers
      # both, because one feature combination is one compilation of the crate: the library
      # suite — which is where the egress tests live — and the automation channel's own
      # target. The default `cargo test` above still runs the cases that are only true
      # without the client, so neither build is left unasserted.
      - name: cargo test (the feature-gated modules)
        working-directory: src-tauri
        run: cargo test --features e2e,net --lib --test e2e_channel

      - name: cargo deny
        working-directory: src-tauri
        run: cargo deny check

      # The crate list of `docs/third-party-notices.md` and of its Italian page is generated
      # from the graph Cargo resolves for the shipped build; a dependency added or bumped
      # without re-running the script would leave the notices describing another build.
      - name: Third-party notices are current
        run: node scripts/third-party-notices.mjs --check

      - name: Frontend tests
        run: pnpm test

      # `pnpm build` runs `svelte-check` first, so the components and the TypeScript are
      # type-checked here as well as compiled.
      - name: Frontend build
        run: pnpm build

      - name: Tauri build
        run: pnpm tauri build --debug

      # DD-33, §11.5: the automation channel "does not exist in release builds ... CI asserts
      # the symbol is absent from release binaries". The gate is `cfg(feature = "e2e")`, so a
      # debug build without the feature must be as clean as a release one, and the bundle
      # above has just produced exactly that binary: the check costs a grep, where a release
      # build here cost seventeen minutes. The release workflow (T-054) runs the same check
      # on the binary it publishes.
      - name: The build carries no automation channel
        run: node scripts/check-no-automation.mjs src-tauri/target/debug/handoff-app.exe

      # The positive control, and it is not decoration: a grep for a string nobody writes
      # passes for ever, including on the day the grep breaks. It needs a binary that *has*
      # the channel, built after the bundle above overwrote `target/debug/handoff-app.exe`
      # without the feature; the dependencies are already compiled, so this is about a
      # minute. The test executable of `e2e_channel` is not a substitute: the linker drops
      # the two names from it, because that test never builds the endpoint path.
      - name: A build that does carry the automation channel
        working-directory: src-tauri
        run: cargo build --features e2e --bin handoff-app

      - name: The check can still fail
        run: node scripts/check-no-automation.mjs --present src-tauri/target/debug/handoff-app.exe

      # The installer's own code (T-054, FM-24): `installer/windows/hooks.nsh` compiled by the
      # makensis the bundle above has just downloaded, and run against folders of its own with
      # a live process holding the server. `pnpm test` above skipped that half for want of
      # makensis; here the variable makes a missing one a failure instead of a skip.
      - name: Installer hooks
        env:
          BATON_REQUIRE_MAKENSIS: '1'
        run: pnpm test src/__tests__/installer-hooks.test.ts

  # The security suite of §11.7 as a job of its own (T-053). It runs the suite alone with its
  # output shown, so the numbers §11.7 asks to be reported per release — the corpus gates
  # and the suspected false-positive rate of R-07 — are in the log of every run, and it keeps
  # `target/security-report.json` as an artifact. The `windows` job runs the same target
  # inside its `cargo test`; this one exists for the report. It restores that job's Rust
  # cache read-only rather than building one of its own, so what it compiles is this crate
  # and not its dependencies, and a dispatch skips it with the `windows` job because the
  # push already ran it for the commit.
  security:
    name: security (windows-latest)
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.windows) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `fetch-server` is a plain Node script: nothing from `node_modules` is needed here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Rust toolchain
        run: rustc --version

      # `shared-key` names the key the `windows` job saves under (its job id), and `save-if`
      # keeps this job from writing a second, competing copy of it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: windows
          save-if: false

      - name: Fetch the pinned server
        run: node scripts/fetch-server.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Security suite
        working-directory: src-tauri
        run: cargo test --test security -- --nocapture

      - name: Security report
        if: always()
        run: cat src-tauri/target/security-report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-report-windows
          path: src-tauri/target/security-report.json
          if-no-files-found: warn

  # The WebDriver suite of §11.4 (T-055): the real window, driven through `tauri-driver` and
  # `msedgedriver` on the runner's desktop session, against fake server sessions and the
  # fixture capture backend. It builds the app it drives itself — a debug build with
  # `--features e2e`, through `tauri build` so the frontend is embedded — because neither
  # binary of the `windows` job is one it can drive: the bundle carries no automation channel,
  # and the positive control looks for the Vite dev server. The Rust cache is the `windows`
  # job's, restored read-only as the `security` job does, so what is compiled here is this
  # crate and not its dependencies. `docs/dev/ui.md` is the harness.
  ui:
    name: ui (windows-latest)
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.windows) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true')
    runs-on: windows-latest
    # Every attempt of every scenario is bounded by the suite; this bounds the job around it,
    # so a driver that hangs costs forty minutes rather than the six hours GitHub allows.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain
        run: rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: windows
          save-if: false

      # `tauri-driver` is a crate the suite pins and installs into `tests/ui/.cache/`
      # (`tests/ui/tools.ts`). The key is that file, so bumping the version installs the new one.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/ui/.cache/tauri-driver
          key: tauri-driver-${{ runner.os }}-${{ hashFiles('tests/ui/tools.ts') }}

      - run: pnpm install --frozen-lockfile

      - name: Fetch the pinned server
        run: node scripts/fetch-server.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build the app the suite drives
        run: pnpm tauri build --debug --no-bundle --features e2e

      # `tauri-driver` from the cache or from crates.io, and the `msedgedriver` of the runner's
      # own WebView2 runtime, whose version is the runner image's to decide.
      - name: WebDriver tools
        run: node tests/ui/main.ts --setup

      - name: UI suite
        run: pnpm test:ui

      # The report always; and a screenshot, the DOM, the error and the output of every failed
      # attempt, the first attempt of a scenario that then passed included.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-results
          path: tests/ui/results/
          if-no-files-found: ignore
          retention-days: 14

  # macOS is deferred (implementation decision 7) and its minutes cost ten times as much, so
  # this leg runs only when it is dispatched by hand; T-059 makes it run on every push.
  # What it proves is that the `cfg(target_os = "macos")` branches written along the way
  # still compile and that their unit tests pass; it does not package anything.
  macos:
    name: macos-latest
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    # `tauri-build` runs in `build.rs`, so it validates `externalBin` and `bundle.resources`
    # for `cargo check`, `clippy` and `test` as well, not only for a bundle. There is no
    # darwin *binary* to validate them against: macOS is deferred (`server.lock.json` pins
    # `win32-x64` and `format` alone) and the release builds its darwin legs only on demand.
    # This job compiles and unit-tests the `cfg(target_os = "macos")` branches and never
    # bundles, so it clears the two bundle inputs instead of standing a placeholder in for
    # the server. `null` is how a JSON merge patch removes a key; the Windows job, which
    # does bundle, uses the real artifact.
    # TASK: T-060 — drop this once darwin binaries are pinned and can be fetched here.
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":null}}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Rust toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # The format material of the pinned release, and only that: the crate embeds the
      # schemas, the channel protocol and the pattern file with `include_str!` (T-029), so
      # nothing compiles without it. The tarball is platform-neutral and is pinned like any
      # other asset, which is why it can be fetched here while the binary cannot.
      - name: Fetch the pinned format material
        run: node scripts/fetch-server.mjs --format-only
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check the pinned format material
        run: node scripts/fetch-server.mjs --check --format-only

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # The security suite of §11.7 on this platform (T-053): the socket, folder and token
      # modes are asserted only here, and the glyph-leak summary says what the engine of this
      # runner could read. A step of this job rather than a job of its own, because the leg
      # is dispatch-only while macOS is deferred (implementation decision 7) and a second macOS job
      # would compile the crate again at ten times the minute; the step above built it.
      # TASK: T-059 — decide whether it becomes a job of its own when this leg runs on push.
      - name: Security suite
        working-directory: src-tauri
        run: cargo test --test security -- --nocapture

      - name: Security report
        if: always()
        run: cat src-tauri/target/security-report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-report-macos
          path: src-tauri/target/security-report.json
          if-no-files-found: warn
