name: CI

# A tag push would otherwise run this whole matrix a second time, on top of the release
# workflow that the tag already triggers. Windows minutes cost double, so the branch filter
# is here from the first commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo clippy --version
          cargo fmt --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - run: pnpm install --frozen-lockfile

      # The pinned server artifact (§3.5). `handoff-mcp` is private, so this needs the
      # cross-repository read token of T-010; it expires on 2027-09-07.
      - name: Fetch the pinned server
        run: node scripts/fetch-server.mjs
        env:
          HANDOFF_MCP_READ_TOKEN: ${{ secrets.HANDOFF_MCP_READ_TOKEN }}

      # The build gate of §3.5, run here as well as inside `beforeBuildCommand`: with `CI`
      # set it also refuses a `dev-link`ed vendor, so no packaged build can come from a
      # locally built server.
      - name: Check the pinned server
        run: node scripts/fetch-server.mjs --check

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: cargo deny
        working-directory: src-tauri
        run: cargo deny check

      - name: Frontend tests
        run: pnpm test

      # `pnpm build` runs `svelte-check` first, so the components and the TypeScript are
      # type-checked here as well as compiled.
      - name: Frontend build
        run: pnpm build

      - name: Tauri build
        run: pnpm tauri build --debug

  # macOS is deferred (TASKS.md §0.4 item 7) and its minutes cost ten times as much, so
  # this leg runs only when it is dispatched by hand. What it proves is that the
  # `cfg(target_os = "macos")` branches written along the way still compile and that their
  # unit tests pass; it does not package anything.
  macos:
    name: macos-latest
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    # `tauri-build` runs in `build.rs`, so it validates `externalBin` and `bundle.resources`
    # for `cargo check`, `clippy` and `test` as well, not only for a bundle. There is no
    # darwin *binary* to validate them against: macOS is deferred (`server.lock.json` pins
    # `win32-x64` and `format` alone) and the release builds its darwin legs only on demand.
    # This job compiles and unit-tests the `cfg(target_os = "macos")` branches and never
    # bundles, so it clears the two bundle inputs instead of standing a placeholder in for
    # the server. `null` is how a JSON merge patch removes a key; the Windows job, which
    # does bundle, uses the real artifact.
    # TASK: T-060 — drop this once darwin binaries are pinned and can be fetched here.
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":null}}'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rust toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The format material of the pinned release, and only that: the crate embeds the
      # schemas, the channel protocol and the pattern file with `include_str!` (T-029), so
      # nothing compiles without it. The tarball is platform-neutral and is pinned like any
      # other asset, which is why it can be fetched here while the binary cannot.
      - name: Fetch the pinned format material
        run: node scripts/fetch-server.mjs --format-only
        env:
          HANDOFF_MCP_READ_TOKEN: ${{ secrets.HANDOFF_MCP_READ_TOKEN }}

      - name: Check the pinned format material
        run: node scripts/fetch-server.mjs --check --format-only

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
