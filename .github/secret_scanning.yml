# GitHub secret scanning: the alerts of the repository and its push protection.
#
# These paths hold synthetic keys on purpose: the screenshot corpus and its labels, which draw a
# fake key of every family, and the suites that plant one to prove it is redacted and never
# leaks. None of them has ever been valid anywhere. The unit tests inside `src-tauri/src/` plant
# a few as well and are still scanned on purpose: an alert there is closed once as "used in
# tests", rather than leaving the sources of the application unwatched.
paths-ignore:
  - "src-tauri/tests/**"
  - "src/__tests__/**"
